<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive ERD Studio</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Multi-Theme CSS Palette Load -->
    <link rel="stylesheet" href="theme.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Top Navigation Header */
        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* View Mode Tabs (Dynamic Auto-Generated) */
        .tabs-container {
            display: flex;
            gap: 6px;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #090d16;
            font-weight: 600;
            box-shadow: 0 0 12px var(--line-glow);
        }

        /* Controls Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-dropdown {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            color: var(--text-main);
            padding: 7px 12px;
            font-size: 0.82rem;
            outline: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .theme-dropdown:hover {
            border-color: var(--accent-blue);
        }

        .theme-dropdown option {
            background: #0f172a;
            color: #f8fafc;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            color: var(--text-main);
            padding: 8px 12px 8px 34px;
            font-size: 0.85rem;
            outline: none;
            width: 180px;
            transition: width 0.3s ease;
        }

        .search-box input:focus {
            width: 240px;
            border-color: var(--accent-blue);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Main Workspace Container */
        .workspace {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0),
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px, 120px 120px, 120px 120px;
            cursor: grab;
            transition: background-color 0.3s ease;
        }

        .workspace:active {
            cursor: grabbing;
        }

        /* Canvas Transform Layer */
        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
        }

        /* SVG Connection Lines Overlay */
        #connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 5000px;
            height: 5000px;
            pointer-events: none;
            z-index: 10;
        }

        path.connection-line {
            fill: none;
            stroke: var(--line-color);
            stroke-width: 2.5;
            filter: drop-shadow(0 0 6px var(--line-glow));
            transition: stroke 0.3s ease, stroke-width 0.3s ease;
        }

        path.connection-line.highlighted {
            stroke: var(--accent-amber);
            stroke-width: 3.5;
            filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.9));
        }

        path.connection-line.dimmed {
            opacity: 0.35;
        }

        /* Table Card Element */
        .table-card {
            position: absolute;
            min-width: 360px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            z-index: 20;
            transition: box-shadow 0.3s ease, border-color 0.3s ease, opacity 0.3s ease, background 0.3s ease;
            cursor: default;
        }

        .table-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 16px 40px var(--line-glow);
        }

        .table-card.selected {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px var(--accent-blue), 0 16px 40px var(--line-glow);
        }

        .table-card.dimmed {
            opacity: 0.35;
        }

        /* Table Header */
        .table-header {
            background: var(--card-header);
            padding: 12px 16px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            border-bottom: 1px solid var(--panel-border);
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .table-name {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-weight: 600;
            font-size: 0.92rem;
            color: var(--accent-blue);
        }

        .table-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .table-badge {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-blue);
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid var(--panel-border);
        }

        /* Columns List */
        .column-list {
            padding: 8px 0;
        }

        .column-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 18px;
            font-size: 0.82rem;
            transition: background 0.2s ease;
            position: relative;
        }

        .column-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .column-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .key-badge {
            font-size: 0.65rem;
            font-weight: 700;
            width: 24px;
            height: 16px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key-pk {
            background: rgba(244, 63, 94, 0.2);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.4);
        }

        .key-fk {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-blue);
            border: 1px solid var(--panel-border);
        }

        .key-none {
            visibility: hidden;
            width: 24px;
        }

        .col-name {
            font-family: 'Fira Code', 'Courier New', monospace;
            color: var(--text-main);
        }

        .col-type {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.74rem;
            color: var(--text-muted);
            padding-left: 12px;
        }

        /* Floating Zoom Controls */
        .zoom-controls {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 4px;
            gap: 4px;
            z-index: 80;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .zoom-percentage {
            font-size: 0.8rem;
            font-family: 'Fira Code', 'Courier New', monospace;
            padding: 0 8px;
            color: var(--text-muted);
            min-width: 48px;
            text-align: center;
        }

        /* Legend Bar */
        .legend-bar {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 16px;
            z-index: 80;
            font-size: 0.75rem;
            color: var(--text-muted);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-line {
            width: 24px;
            height: 3px;
            background: var(--accent-blue);
        }

        .legend-line.dashed {
            background: repeating-linear-gradient(90deg, var(--accent-blue) 0 4px, transparent 4px 8px);
        }

        /* Slide-out Inspector Drawer */
        .inspector-drawer {
            position: absolute;
            top: 60px;
            right: -480px;
            width: 460px;
            bottom: 0;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--panel-border);
            z-index: 90;
            transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -12px 0 32px rgba(0,0,0,0.5);
        }

        .inspector-drawer.open {
            right: 0;
        }

        .drawer-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-title {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 1.1rem;
            color: var(--accent-blue);
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Pure Monospace SQL Code Box */
        .sql-box-container {
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
        }

        pre.sql-code-block {
            font-family: 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace !important;
            font-size: 0.78rem;
            line-height: 1.55;
            color: var(--accent-blue);
            margin: 0;
            white-space: pre !important;
            word-break: normal;
            font-variant-numeric: tabular-nums;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .copy-btn:hover {
            background: var(--accent-blue);
            color: #090d16;
        }
    </style>
</head>
<body class="theme-cyber-navy">

    <!-- Header Navigation -->
    <header>
        <div class="brand">
            <i class="fa-solid fa-diagram-project" style="color: var(--accent-blue);"></i>
            <span>ERD Studio</span>
            <span class="brand-badge">PRO v0.0.3</span>
        </div>

        <!-- Dynamic Auto-Generated Tabs Container -->
        <div class="tabs-container" id="tabs-container"></div>

        <div class="toolbar">
            <!-- Multi-Theme Dropdown Selector -->
            <select id="theme-select" class="theme-dropdown" onchange="changeTheme(this.value)">
                <option value="theme-cyber-navy">🌐 사이버 네이비 (Cyber Navy)</option>
                <option value="theme-industrial-slate">⚙️ 산업 슬레이트 (Industrial Slate)</option>
                <option value="theme-charcoal-gray">🐘 차콜 그레이 (Charcoal Gray)</option>
                <option value="theme-midnight-gold">👑 미드나잇 골드 (Midnight Gold)</option>
            </select>

            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="search-input" placeholder="테이블/컬럼 실시간 검색..." onkeyup="handleSearch()">
            </div>
            <button class="btn-icon" onclick="resetZoom()" title="화면 맞춤"><i class="fa-solid fa-compress"></i></button>
            <button class="btn-icon" onclick="toggleInspector()" title="인스펙터 열기/닫기"><i class="fa-solid fa-sidebar"></i></button>
        </div>
    </header>

    <!-- Main Workspace Area -->
    <div class="workspace" id="workspace">
        <div id="canvas-layer">
            <svg id="connections-svg">
                <defs>
                    <!-- Dynamic Theme Arrow Marker for Line Target -->
                    <marker id="marker-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
                        <path id="arrow-path" d="M 2,2 L 10,6 L 2,10 Z" fill="var(--accent-blue)" stroke="var(--accent-blue)" stroke-width="1.5" stroke-linejoin="round" />
                    </marker>
                </defs>
            </svg>
            <div id="cards-container"></div>
        </div>

        <!-- Zoom Floating Bar -->
        <div class="zoom-controls">
            <button class="btn-icon" onclick="zoomCanvas(0.9)"><i class="fa-solid fa-minus"></i></button>
            <span class="zoom-percentage" id="zoom-text">100%</span>
            <button class="btn-icon" onclick="zoomCanvas(1.1)"><i class="fa-solid fa-plus"></i></button>
            <button class="btn-icon" onclick="resetZoom()"><i class="fa-solid fa-rotate-left"></i></button>
        </div>

        <!-- Legend Bar -->
        <div class="legend-bar">
            <div class="legend-item">
                <div class="legend-line"></div>
                <span>식별 관계 (Solid Line)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line dashed"></div>
                <span>비식별 관계 (Dashed Line)</span>
            </div>
            <div class="legend-item">
                <span style="color: var(--accent-blue); font-weight: 700;">1 : N</span>
                <span>수량 수식 배지 (Cardinality)</span>
            </div>
        </div>
    </div>

    <!-- Inspector Drawer -->
    <div class="inspector-drawer" id="inspector">
        <div class="drawer-header">
            <div>
                <div class="drawer-title" id="drawer-table-name">EMPLOYEES</div>
                <div class="table-desc" id="drawer-table-desc">사원 마스터 테이블</div>
            </div>
            <button class="btn-icon" onclick="toggleInspector()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="drawer-content">
            <div>
                <h4 style="font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted);">오라클 DDL 정의</h4>
                <div class="sql-box-container">
                    <button class="copy-btn" onclick="copyCode('ddl-text')"><i class="fa-regular fa-copy"></i> 복사</button>
                    <pre class="sql-code-block" id="ddl-text"></pre>
                </div>
            </div>
            <div>
                <h4 style="font-size: 0.85rem; margin-bottom: 8px; color: var(--accent-amber);">테스트용 Mock INSERT 쿼리 (1초 실행)</h4>
                <div class="sql-box-container">
                    <button class="copy-btn" onclick="copyCode('mock-text')"><i class="fa-regular fa-copy"></i> 복사</button>
                    <pre class="sql-code-block" id="mock-text"></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- Central Schema Data JS Load -->
    <script src="schema_data.js"></script>

    <script src="app.js"></script>
</body>
</html>
